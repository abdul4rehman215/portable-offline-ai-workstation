version = 1

; Paths are relative to the repository/USB root.
; Start the router with its working directory set to the repository root.

[*]
parallel = 1
threads = 4
load-on-startup = false

[fast]
model = ./models/fast/Qwen3-1.7B-Q8_0.gguf
c = 2048
reasoning = off

[reasoning]
model = ./models/reasoning/Qwen3-4B-Q4_K_M.gguf
c = 4096
reasoning = on

[coding]
model = ./models/coding/qwen2.5-coder-3b-instruct-q4_k_m.gguf
c = 4096

[vision]
model = ./models/vision/Qwen3VL-2B-Instruct-Q4_K_M.gguf
mmproj = ./models/vision/mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf
c = 4096

[embeddings]
model = ./models/embeddings/Qwen3-Embedding-0.6B-Q8_0.gguf
c = 2048
embedding = true
